buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.8.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.10"
    }
}


def getExtOrDefault(name) {
    return rootProject.ext.has(name)
            ? rootProject.ext.get(name)
            : project.properties["NitroFusedLocation_" + name]
}


def getExtOrIntegerDefault(name) {
    return rootProject.ext.has(name)
            ? rootProject.ext.get(name)
            : (project.properties["NitroFusedLocation_" + name]).toInteger()
}


apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "kotlin-kapt"

apply from: '../nitrogen/generated/android/NitroFusedLocation+autolinking.gradle'


android {

    namespace "com.margelo.nitro.nitrofusedlocation"

    ndkVersion getExtOrDefault('ndkVersion')

    compileSdkVersion getExtOrIntegerDefault('compileSdkVersion')


    defaultConfig {

        minSdkVersion getExtOrIntegerDefault('minSdkVersion')

        targetSdkVersion getExtOrIntegerDefault('targetSdkVersion')


        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }


    buildTypes {

        debug {
            buildConfigField(
                    "boolean",
                    "IS_NEW_ARCHITECTURE_ENABLED",
                    "true"
            )
        }

        release {
            buildConfigField(
                    "boolean",
                    "IS_NEW_ARCHITECTURE_ENABLED",
                    "true"
            )
        }
    }


    buildFeatures {
        buildConfig true
        prefab true
    }


    externalNativeBuild {

        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }


    kotlinOptions {
        jvmTarget = "17"
    }
}


kapt {
    correctErrorTypes true
}



dependencies {

    compileOnly "com.facebook.react:react-android"
    implementation project(':react-native-nitro-modules')
    implementation "com.facebook.fbjni:fbjni:0.7.0"
    // Coroutine
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    // Room
    implementation "androidx.room:room-runtime:2.7.0"
    implementation "androidx.room:room-ktx:2.7.0"
    kapt "androidx.room:room-compiler:2.7.0"
    // Kotlin metadata fix
    implementation "org.jetbrains.kotlinx:kotlinx-metadata-jvm:0.9.0"
    // Gson
    implementation "com.google.code.gson:gson:2.10.1"
}