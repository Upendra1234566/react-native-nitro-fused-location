dependencies {
    // Binary copy mat karo, sirf headers/interfaces compile karo
    compileOnly "com.facebook.react:react-android"
    
    implementation project(':react-native-nitro-modules')
    implementation "com.facebook.fbjni:fbjni:0.7.0"
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'
}
def getExtOrDefault(name) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["NitroFusedLocation_" + name]
}

def getExtOrIntegerDefault(name) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["NitroFusedLocation_" + name]).toInteger()
}