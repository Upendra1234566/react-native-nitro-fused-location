/////////////////////////////////////////////////////////////////////////


apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    newArchEnabled = true
    reactNativeDir = file("../../../node_modules/react-native")
    codegenDir = file("../../../node_modules/@react-native/codegen")
    cliFile = file("../../../node_modules/react-native/cli.js")
    
    // Path ko double check karein, agar error aaye toh ise absolute path se replace karein
    // hermesCommand = "$rootDir/../../node_modules/hermes-compiler/hermesc/%OS-BIN%/hermesc"
    hermesCommand = "$rootDir/../../node_modules/react-native/sdks/hermesc/%OS-BIN%/hermesc"
    
    autolinkLibrariesWithApp()
}

android {
    namespace "com.nitrofusedlocationexample"
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "com.nitrofusedlocationexample"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        
        // Architecture filters (Important for release)
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release ke liye bhi debug signing use kar sakte hain (testing ke liye), 
        // lekin play store ke liye khud ki key honi chahiye
        release {
            storeFile file('debug.keystore') 
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    packagingOptions {
        pickFirsts.add("**/libjsi.so")
        pickFirsts.add("**/libreactnative.so")
        pickFirsts.add("**/libreact_nativemodule_core.so")
        pickFirsts.add("**/libturbomodulejsijni.so")
        pickFirsts.add("**/libNitroFusedLocation.so")
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false 
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    // Nitro modules aur aapki library
    implementation project(':react-native-nitro-modules')
    implementation project(':react-native-nitro-fused-location')

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation 'io.github.react-native-community:jsc-android:2026004.+'
    }
}