
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.kapt" // <- NAYA
apply plugin: "com.facebook.react"

react {
    newArchEnabled = true
    reactNativeDir = file("../../../node_modules/react-native")
    codegenDir = file("../../../node_modules/@react-native/codegen")
    cliFile = file("../../../node_modules/react-native/cli.js")
    hermesCommand = "$rootDir/../../node_modules/react-native/sdks/hermesc/%OS-BIN%/hermesc"
    
    autolinkLibrariesWithApp()
}

android {
    namespace "com.nitrofusedlocationexample"
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "com.nitrofusedlocationexample"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        
        // Architecture filters (Important for release)
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release ke liye bhi debug signing use kar sakte hain (testing ke liye), 
        // lekin play store ke liye khud ki key honi chahiye
        release {
            storeFile file('debug.keystore') 
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    packagingOptions {
        pickFirsts.add("**/libjsi.so")
        pickFirsts.add("**/libreactnative.so")
        pickFirsts.add("**/libreact_nativemodule_core.so")
        pickFirsts.add("**/libturbomodulejsijni.so")
        pickFirsts.add("**/libNitroFusedLocation.so")
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false 
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    // Nitro modules aur aapki library
    implementation project(':react-native-nitro-modules')
    implementation project(':react-native-nitro-fused-location')

     // YE 6 LINE ADD KAR DE
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    implementation "com.google.code.gson:gson:2.14.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation 'io.github.react-native-community:jsc-android:2026004.+'
    }
} 
