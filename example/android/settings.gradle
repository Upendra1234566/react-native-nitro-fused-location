pluginManagement {
    includeBuild("../../node_modules/@react-native/gradle-plugin")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand()
}

rootProject.name = "NitroFusedLocationExample"

include(":app")

// Nitro Modules
include(":react-native-nitro-modules")
project(":react-native-nitro-modules").projectDir =
    new File(rootProject.projectDir, "../../node_modules/react-native-nitro-modules/android")

// Your Library
include(":react-native-nitro-fused-location")
project(":react-native-nitro-fused-location").projectDir =
    new File(rootProject.projectDir, "../../android")

includeBuild("../../node_modules/@react-native/gradle-plugin")